# The parts of Live Notebook that run without Claude Code (the note format and the web server), on every OS.
# The Mod's own tests need Claude Code (`claude plugin test .`) and run locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:node
      # The editor extension: its runtime copies cleanly and its entry point parses. Its tests need VS Code
      # itself (extensions/vscode/test/run.mjs) and run locally.
      - run: node extensions/vscode/scripts/bundle.mjs
      - run: node --check extensions/vscode/extension.cjs
